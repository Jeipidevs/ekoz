<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E2B8" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <linearGradient id="mossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3D2F" />
      <stop offset="100%" stop-color="#0E1A14" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon or circle -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#mossGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Outer resonance pulse arc -->
  <path d="M 28 32 A 28 28 0 0 1 72 32" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 22 26 A 36 36 0 0 1 78 26" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Ekoz Monogram 'E' & Soundwave fusion -->
  <path d="M 32 40 L 68 40" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)" />
  <path d="M 32 52 L 58 52" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)" />
  <path d="M 32 64 L 68 64" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)" />
  <path d="M 32 38 L 32 66" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Small diamond accent representing high performance / luxury -->
  <polygon points="72,52 75,48 78,52 75,56" fill="url(#goldGrad)" />
</svg>
